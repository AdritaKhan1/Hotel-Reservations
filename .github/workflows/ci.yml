name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest runners ship with Docker, which Testcontainers needs to
      # start the PostgreSQL container during `mvn verify`.
      - name: Build and run tests
        run: mvn -B verify
