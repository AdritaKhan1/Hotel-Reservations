services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotelbooking"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://db:5432/hotelbooking
      - DB_USER=hotel
      - DB_PASSWORD=hotel
    ports:
      - "8080:8080"
